<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Авто: лампы и отзывы</title>
<meta name="theme-color" content="#2f3640">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--surface:#fff;--fg:#1b1f27;--muted:#667085;--line:#dfe3ea;--blue:#1c5fb8;--green:#1e8e4e;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#13161b;--surface:#1c2027;--fg:#e8ebf0;--muted:#98a2b3;--line:#2c323c;--blue:#4b8be0;--green:#3db573;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.45;min-height:100vh;
padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:640px;margin:0 auto}
h1{font-size:22px;margin:8px 0 20px;font-weight:600}
.grid{display:grid;gap:12px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 18px 22px;position:relative;overflow:hidden}
a.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
a.card:hover,a.card:focus-visible{border-color:var(--c);outline:none}
a.card b{display:block;font-size:19px;margin-bottom:4px}
a.card span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Авто</h1>
<div class="grid">
<a class="card" href="lamps/" style="--c:var(--green)"><b>Подбор ламп</b><span>Галогеновые лампы по марке, модели и поколению: ближний, дальний, ПТФ.</span></a>
<a class="card" href="h4/" style="--c:var(--blue)"><b>Отзывы H4</b><span>Отзывы о лампах H4 по автомобилям.</span></a>
</div>
</main>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
