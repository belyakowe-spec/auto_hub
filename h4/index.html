/* Layout: sticky search bar on top, overview of cars or result list below, one column up to ~860px */
:root{

  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1a2320; --ink:#e7eeeb; --muted:#9aaaa3; --line:#2c3935;
  --accent:#6aa5f0; --accent-ink:#0b1420; --mark:#6b5a12; --warn:#e0a24a; --chip:#242f2b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1a2320; --ink:#e7eeeb; --muted:#9aaaa3; --line:#2c3935;
  --accent:#6aa5f0; --accent-ink:#0b1420; --mark:#6b5a12; --warn:#e0a24a; --chip:#242f2b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:900px;margin:0 auto}
header{padding-block:22px 12px}
h1{font-size:22px;line-height:1.25;margin:0;font-weight:600;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.search{display:flex;gap:8px}
.search input[type=search]{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button{font:inherit;cursor:pointer}
.btn{padding:10px 14px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,.car:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;color:var(--muted);font-size:13px;align-items:center}
.opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.opts select{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.status{margin:14px 0 8px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.status b{font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:4px 10px;border-radius:999px;font-size:13px}
.chip .mono{color:var(--muted);margin-left:6px;font-size:12px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed=true] .mono{color:inherit}
.brand{margin:22px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.car{display:flex;justify-content:space-between;gap:8px;align-items:baseline;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 10px;border-radius:5px;min-width:0}
.car:hover{border-color:var(--accent)}
.car span:first-child{overflow-wrap:anywhere}
.car .mono{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
article{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:6px}
.name{font-weight:600}
.det{font-size:13px;color:var(--muted)}
.flag{font-size:12px;color:var(--warn);border:1px solid var(--warn);border-radius:3px;padding:0 5px}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.more{margin:16px 0;display:flex;justify-content:center}
.empty{padding:28px 0;color:var(--muted)}
.theme{margin-left:auto}
@media (max-width:520px){.meta{margin-left:0;width:100%}}
@media (prefers-reduced-motion:no-preference){.btn,.car,.chip{transition:border-color .12s}}
</style>

тель, потому что лампа не становится. винтик на лампочке для регулировки угла наклона, благодоря ему сделал правильный угол света. светят лучше родных в три раза. встречных водителей не слепят.","u":false},{"n":264,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"2012","f":"","k":0,"w":"хендай сорярис","a":"Роман Б.","d":"16 марта 2025","t":"2025-03-16","s":"Совм2","z":"H4-H4 Long","x":"Отзыв устарел\nЛампы хорошие , работают . Не так конечно как полноценные линзы , но гораздо лучше чем галогенки или обычные светодиодные . Но на хендай сорярис 2012 года не стали без изменения конструкции фары . Пришлось повозиться , внутри отражатель который стоит в заводских фарах не дал этой лампе стать на своей место , пришлось снимать фару и выламывать их. Это...  Читать полностью","u":true},{"n":265,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"","f":"","k":0,"w":"соляриса","a":"Сайдаш С.","d":"8 февраля 2025","t":"2025-02-08","s":"Совм2","z":"H4-H4 Long","x":"Отзыв устарел\nотлично светят, пришлось повозиться со снятием колпачков с фар соляриса","u":false},{"n":266,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"1","y":"","f":"","k":0,"w":"солярис","a":"Николай И.","d":"2 февраля 2025","t":"2025-02-02","s":"Совм2","z":"H4-H4 Long","x":"Отзыв устарел\nЛампы отличные! Установил на солярис 1, освещают прекрасно. Главное, чтобы заявленное колличество часов производителем отработали не меньше. Всем добра!","u":false},{"n":267,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"1","y":"","f":"","k":0,"w":"Солярис","a":"Заур Л.","d":"2 февраля 2025","t":"2025-02-02","s":"Совм2","z":"H4-H4 Long","x":"Отзыв устарел\nОпределенно стоят своих денег\nУстановил в Солярис 1 пришлось удалить колпачек в фаре\nСветят хорошо","u":false},{"n":268,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"1","y":"","f":"рестайлинг","k":0,"w":"Солярис","a":"Серёга П.","d":"30 января 2025","t":"2025-01-30","s":"Совм2","z":"H4-H4 Long","x":"Отзыв устарел\nПоставил на Солярис 1 (рест) все встало как надо, удалил только колпачки из фар , прежде сняв фары с авто , стг четкая , светят хорошо , корректором фар под регулировал как надо ,после лед ламп обычных эти с линзой намного лучше, рекомендую","u":false},{"n":269,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"","f":"","k":0,"w":"Солярис","a":"Владимир А.","d":"4 декабря 2024","t":"2024-12-04","s":"Совм2","z":"H4-H4 Long","x":"Отзыв устарел\nДвоякое впечатление... Вроде всё норм. Но спустя месяц стали отдавать синевой. Сразу этого не было. Мощность думаю завышена... А так норм. Солярис. Колпачки удалял. Крышки родные не закрыть.","u":false},{"n":270,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"2","y":"","f":"","k":0,"w":"Солярис","a":"Эрик Н.","d":"24 октября 2024","t":"2024-10-24","s":"Совм2","z":"H4-H4 Long","x":"Отзыв устарел\nВполне хороший товар в данном сегменте и по цене и по качеству. С установкой заморочки были на Солярис 2 но без ужасов, все лезет все подходит просто время занимает именно упаковка конденсаторов в саму фару, дабы закрыть пылевлагозащитную крышку в дальнейшем. И при установке необходимо выкрутить кулер с лампы иначе не полезет в сборе, лампа довольна...  Читать полностью","u":true},{"n":271,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"2014","f":"хэтчбек","k":0,"w":"Солярис","a":"Имя скрыто","d":"27 марта 2024","t":"2024-03-27","s":"Совм2","z":"H4-H4 Long","x":"Отзыв устарел\nНе подошли на Солярис 14 года хетчбек но продавец быстро оформил возврат","u":false},{"n":272,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"","f":"хэтчбек","k":0,"w":"Hyundai Solaris","a":"Юрий К.","d":"28 августа 2026","t":"2026-08-28","s":"Совм6","z":"H4","x":"Сами лампочки неплохого качества, но они просто не подошли на мою Hyundai Solaris хэтчбек пятнадцатого года. В описании было написано, что подходят, но они не подошли ни по длине лампочки, ни по диаметру отверстия в отражателе фары.","u":false},{"n":273,"b":"Hyundai"," ся крышка фары на Солярисе 1 поколения. Не знаю зачем 🤔 люди пишут что у них всё получилось. Что-то колхозить ставить увеличенную заднюю крышку не захотел, так как там и так не много места. Обидно только что зря потратил время на снятие и установку...  Читать полностью","u":true},{"n":319,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"","f":"","k":0,"w":"Solaris","a":"Денис П.","d":"15 сентября 2024","t":"2024-09-15","s":"Совм3","z":"H4-H4A-H4B-H4H, Количество ламп, шт: 2","x":"Отзыв устарел\nПришлось лампы допиливать болгаркой, чтобы встали ровно. Авто Solaris hs 2024","u":false},{"n":320,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"","f":"","k":0,"w":"хундай салярис","a":"Владимир И.","d":"30 августа 2024","t":"2024-08-30","s":"Совм3","z":"H4-H4A-H4B-H4H, Количество ламп, шт: 2","x":"Отзыв устарел\nНа хундай салярис подошли,нужны увеличеные крышки фар.родные короткие.заказал отдельно под лег лампочки.","u":false},{"n":321,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"","f":"","k":0,"w":"соляриса","a":"Алексей П.","d":"15 октября 2025","t":"2025-10-15","s":"Совм3","z":"H4-H4A-H4B-H4H, Количество ламп, шт: 2","x":"Отзыв устарел\nY7D поставил на солярис 1. Свет отличный. Штатные крышки на фаре не подходят. Отверстие для лампочки внутри фар соляриса не по центру и в итоге радиатор лампочки не только выпирает, но и прижат к краю за который ципляется крышка к фаре.\nЗауженая крышка большей глубины тоже не подойдёт, т.к. лампа по глубине влазит, но упирается в бок крышки. Берите...  Читать полностью","u":true},{"n":322,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"","f":"","k":0,"w":"Солярис","a":"Сабур А.","d":"14 августа 2024","t":"2024-08-14","s":"Совм3","z":"H4-H4A-H4B-H4H, Количество ламп, шт: 2","x":"Отзыв устарел\nСначало купил проверить как они светят брал на Солярис светят бомбо и я так подумал купить ещё один и поставил на грузовой авто hyundai HD35S спасибо огромное цвет просто бомба","u":false},{"n":323,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"1","y":"","f":"","k":0,"w":"солярис","a":"Иван А.","d":"16 августа 2024","t":"2024-08-16","s":"Совм3","z":"H4-H4A-H4B-H4H, Количество ламп, шт: 2","x":"Отзыв устарел\nУстановил. Свет отличный. Граница СТГ четкая (при правильной регулировке. Покупал для солярис 1.\nНаконец-то стало все видно в темное время.\nДальний бьет хорошо и ярко.\nВыполнено качественно и крепко.\nДолговечность и будет ли падать яркость света при нагреве покажет время. Пока сказать не готов.","u":false},{"n":324,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"2021","f":"","k":0,"w":"солярис","a":"Дмитрий П.","d":"23 июля 2024","t":"2024-07-23","s":"Совм3","z":"H4-H4A-H4B-H4H, Количество ламп, шт: 2","x":"Отзыв устарел\nНа солярис 2021 года подошли отлично. Свет очень широкий и яркий. Я доволен товаром полностью. До этих ламп пробовал многие лед линзы,но эти пока что лучшие!!!","u":false},{"n":325,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"","f":"","k":0,"w":"хундай салярис1","a":"Сабур А.","d":"30 июня 2024","t":"2024-06-30","s":"Совм3","z":"H4-H4A-H4B-H4H, Количество ламп, шт: 2","x":"Отзыв устарел\nПоставил на хундай салярис1 топ а не цвет мне очень нравится","u":false},{"n":326,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"","f":"","k":0,"w":"Солярис","a":"Виталий К.","d":"12 июня 2024","t":"2024-06-12","s":"Совм3","z":"H4-H4A-H4B-H4H, Количество ламп, шт: 2","x":"Отзыв устарел\nДостоинства\nНа Солярис подошли, светят ярко","u":false},{"n":327,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"","f":"","k":0,"w":"Solaris","a":"Имя скрыто","d":"26 мая 2024","t":"2024-05-26","s":"Совм3","z":"H4-H4A-H4B-H4H, Количество ламп, шт: 2","x":"Отзыв устарел\nДостоинства\nРаботают и светят отлично.\nНедостатки\nПосадочные места не соответствуют заявленым H 4.\nКомментарий\nНа Solaris не подошли из-за большого блока куллера. Уперается в механизм закрытия заглушки. Поэтому её невозможно закрыть.","u":false},{"n":328,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"","f":"","k":0,"w":"Солярис","a":"Хажмурат А.","d":"8 апреля 2024","t":"2024-04-08","s":"Совм3","z":"H4-H4A-H4B-H4H, Количество ламп, шт: 2","x":"Отзыв устарел\nПервое радует что есть гарантия и есть поддержка от продавца. Свет стал лучше на много по сравнению с тем как было . Настроил сам , на Солярис надо снять фару по другому никак не получится поставить . И уже после установки настроить в темное время суток фары не установлевая бампер. Ближний хорош , а вот дальний так себе. Я знал что дальний не очень...  Читать полностью","u":true},{"n":329,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"2020","f":"","k":0,"w":"Солярис","a":"Дмитрий С.","d":"11 марта 2024","t":"2024-03-11","s":"Совм3","z":"H4-H4A-H4B-H4H, Количество ламп, шт: 2","x":"Отзыв устарел\nВ Солярис 20 года встали, все хорошо","u":false},{"n":330,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"","f":"","k":0,"w":"солярисе","a":"Дмитрий М.","d":"17 января 2024","t":"2024-01-17","s":"Совм3","z":"H4-H4A-H4B-H4H, Количество ламп, шт: 2","x":"Отзыв устарел\nСветят отлично, по сравнению со штатным светом на солярисе. Только на одной лампе дальний светит пониже чем на другой, может это зависит от отражателей,не знаю. Одна фара не завод.","u":false},{"n":331,"b":"Hyundai","m":"Solaris","c":"Hyundai Solaris","g":"","y":"","f":"","k":0,"w":"салярис","a":"Айдар В.","d":"18 октября 2023","t":"2023-10-18","s":"Совм3","z":"H4-H4A-H4B-H4H, Количество ламп, шт: 2","x":"Отзыв устарел\nДостоинства\nсветит не плоха\nНедостатки\nвроде нету\nКомментарий\nна салярис поставил 2016 года, хороши свет если сравнивать обычной лампочкой","u":false},{"n":332,"b":"Hyundai","m":"Tucson","c":"Hyundai Tucson","g":"1","y":"","f":"","k":0,"w":"туксон","a":"Артем Б.","d":"6 декабря 2025","t":"2025-12-06","s":"Совм2","z":"H4-H4 Long","x":"Светят супер... На туксон 1 придётся не хило калхозить потому что по размером н g":"","y":"2025","f":"","k":0,"w":"Гранту","a":"Антон В.","d":"15 октября 2025","t":"2025-10-15","s":"Совм4","z":"H4-H19","x":"Лампы светят хорошо, на вид качественные, установка простая, на Гранту 2025 подошли как родные, посмотрим сколько проходят, советую!","u":false},{"n":525,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"2021","f":"","k":0,"w":"гранту","a":"макс","d":"4 октября 2025","t":"2025-10-04","s":"Совм4","z":"H4-H19","x":"На гранту 21 года подходят без проблем. Светят хорошо. Но нужно регулировать.","u":false},{"n":526,"b":"Lada","m":"Granta","c":"Lada Granta","g":"1","y":"","f":"","k":0,"w":"Лады Гранты","a":"олег е.","d":"3 октября 2025","t":"2025-10-03","s":"Совм4","z":"H4-H19","x":"По внешнему виду лампы выглядят очень достойно, качество чувствуется в каждой детали. Брал для Лады Гранты 1, установка заняла около 15 минут, сложности были с регулировкой, пришлось регулировать как блок фару, так и отдельно каждую лампу по шаблону. Но все усилия дали превосходный результат, линии СТГ, пучок Д.С. просто огонь!!!! Большое спасибо продавцу...  Читать полностью","u":true},{"n":527,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"FL","k":0,"w":"гранду","a":"Максим К.","d":"30 сентября 2025","t":"2025-09-30","s":"Совм4","z":"H4-H19","x":"Отзыв устарел\nУстановил на гранду фл\nВсё ок. Свет стал значительно лучше.\nПроблем с установкой нет","u":false},{"n":528,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"2018","f":"лифтбек","k":0,"w":"гранту","a":"Егор А.","d":"25 сентября 2025","t":"2025-09-25","s":"Совм4","z":"H4-H19","x":"Отзыв устарел\nпришло в хорошей упаковке. В наличии 2 лампы, болтикт, белые перчатки.. На линзах защитные пленки. Установил на гранту лифтбек 2018 года. Трудностей при установке не возникло.","u":false},{"n":529,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"2018","f":"","k":0,"w":"гранту","a":"Ильназ А.","d":"22 сентября 2025","t":"2025-09-22","s":"Совм4","z":"H4-H19","x":"Отзыв устарел\nЛампочки очень понравились, установил быстро на гранту 2018года, светят отлично","u":false},{"n":530,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"FL","k":0,"w":"Lada Granta","a":"Сергей Х.","d":"18 сентября 2025","t":"2025-09-18","s":"Совм4","z":"H4-H19","x":"Отзыв устарел\nК\nКонстантин З.\n17 сентября 2025\nОтзыв устарел\nТипоразмер автолампы: H4-H19\nЛампы получил, уже установил. Лампы работают, светят. Автомобиль Lada Granta FL. Возникли следующие трудности при установке.\n1. Одна фара была новой, заменена после ДТП в начале лета этого года. Идея то установить эти лампы и появилась после того, как наступила осень и стало рано темнеть на улице. Новая фара с установленной галогеновой лампой не поддавалась...  Читать полностью","u":true},{"n":531,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"2024","f":"FL","k":0,"w":"гранта","a":"Евгений Л.","d":"15 сентября 2025","t":"2025-09-15","s":"Совм4","z":"H4-H19","x":"Отзыв устарел\nгранта фл 2024 года, подошли, но требуется регулировка :)","u":false},{"n":532,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"FL","k":0,"w":"гранту","a":"Андрей П.","d":"16 декабря 2025","t":"2025-12-16","s":"Совм4","z":"H4-H19","x":"Отзыв устарел\nНа гранту фл без доработок\nДополнение к отзыву: хотелось бы поблагодарить ребята за оперативность, одна лампа была с браком, своевременно отреагировали и прислали замену бесплатно. Советую!","u":false},{"n":533,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"2018","f":"","k":0,"w":"Lada Granta","a":"Василий В.","d":"10 сентября 2025","t":"2025-09-10","s":"Совм4","z":"H4-H19","x":"Отзыв устарел\nотличные лампы, на автомобиль Lada Granta 2018 г.в. седан, подошли идеально, светят отлично, при установке нужно открутить вентилятор, чтобы одеть резиновый кожух, и использовать стяжки для подвязки блоков либо проводов","u":false},{"n":534,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"FL","k":0,"w":"Гранту","a":"Антон И.","d":"30 августа 2025","t":"2025-08-30","s":"Совм4","z":"H4-H19","x":"Отзыв устарел\nХорошие лампы светят хорошо .На Гранту Фл вошли без переделок","u":false},{"n":535,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"2021","f":"","k":0,"w":"лада гранта","a":"Тимур К.","d":"26 августа 2025","t":"2025-08-26","s":"Совм4","z":"H4-H19","x":"Отзыв устарел\nподошли идеально, разница думаю сразу на глаз.Вставил сначала в одну фару и был в шоке .На втором фото показал как установить резиновый уплотнитель.А то некоторые пишут что нужно обрезать пыльник.Машина лада гранта 2021 год","u":false},{"n":536,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"","k":0,"w":"гранту","a":"Руслан С.","d":"23 августа 2025","t":"2025-08-23","s":"Совм4","z":"H4-H19","x":"Отзыв устарел\nСветят бомба!!! Установил на гранту, очень доволен)","u":false},{"n":537,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"кросс","k":0,"w":"гранту","a":"Артём К.","d":"15 августа 2025","t":"2025-08-15","s":"Совм4","z":"H4-H19","x":"Отзыв устарел\nна гранту кросс подошли отлично, только резиновые уплотнители пришлось немного доработать, чтобы провод вывести.","u":false},{"n":538,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"FL","k":0,"w":"Лада гранта","a":"Сергей Е.","d":"10 июня 2025","t":"2025-06-10","s":"Совм4","z":"H4-H19","x":"Отзыв устарел\nПоставил без проблем. Всё работает.. Всё подошло, ничего вырезать не пришлось. Лада гранта фл. Но создаёт помехи на радио.","u":false},{"n":539,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"2024","f":"","k":0,"w":"ладу гранта","a":"Алексей И.","d":"11 мая 2025","t":"2025-05-11","s":"Совм4","z":"H4-H19","x":"Отзыв устарел\nПоставил на ладу гранта 2024 г.в., вроде как всё норм, но у пыльника чуть отверстие расширил, буквально на 3 мм по окружности, так как кулер не накручивался до конца и контакта не было..., а в целом свет хороший \"границы\" соответствуют галогенкам, настраивать не пришлось, посмотрим сколько будут ходить, советую.","u":false},{"n":540,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"","k":0,"w":"гранту","a":"Аслан Т.","d":"7 февраля 2026","t":"2026-02-07","s":"Совм2","z":"H4-H4 Long","x":"Покупались в подарок поставили на гранту встали как родные светят хорошо","u":false},{"n":541,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"","k":0,"w":"гранту","a":"Константин М.","d":"10 декабря 2025","t":"2025-12-10","s":"Совм2","z":"H4-H4 Long","x":"на гранту не влазят по диаметру. нужно расшиперивать железяку. как светят- не проверял. после установки дополню.","u":false},{"n":542,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"FL","k":0,"w":"гранту","a":"Иван В.","d":"5 декабря 2025","t":"2025-12-05","s":"Совм2","z":"H4-H4 Long","x":"упаковка целая, но внутри коробки положили одну перчатку, и штекера не разъемные. светят не плохо стг имеется. в гранту фл подошли без проблем.","u":false},{"n":543,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"","k":0,"w":"Гранту","a":"Ильдар Х.","d":"14 ноября 2025","t":"2025-11-14","s":"Совм2","z":"H4-H4 Long","x":"Установил на Гранту без проблем. Светят по сравнению с галогенами отлично, день и ночь.","u":false},{"n":544,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"2023","f":"кросс","k":0,"w":"гранта","a":"Григорий Е.","d":"5 ноября 2025","t":"2025-11-05","s":"Совм2","z":"H4-H4 Long","x":"Пришлось немного по мучаться на установку и регулеровку(гранта кросс 23г), светят хорошо но не хватает немного яркости.","u":false},{"n":545,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"","k":0,"w":"гранту","a":"Светлана А.","d":"21 октября 2025","t":"2025-10-21","s":"Совм2","z":"H4-H4 Long","x":"поставил на гранту свет огонь","u":false},{"n":546,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"","k":0,"w":"гранту","a":"Имя скрыто","d":"7 октября 2025","t":"2025-10-07","s":"Совм2","z":"H4-H4 Long","x":"Норм светят. Ставил на гранту. С настройками немного пришлось помудрить добавил ещё два болтиками вниз лампы. И пкой доволен, установка Гранта фл не сложно","u":false},{"n":738,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"2015","f":"","k":0,"w":"гранту","a":"Кирилл","d":"29 сентября 2025","t":"2025-09-29","s":"Совм6","z":"H4","x":"Отзыв устарел\nна гранту 2015 года пришлось долго мучаться с установкой, разбирать лампу, колхозить, подойдёт только для людей с руками","u":false},{"n":739,"b":"Lada","m":"Granta","c":"Lada Granta","g":"1","y":"","f":"","k":0,"w":"гранту","a":"Александр И.","d":"27 сентября 2025","t":"2025-09-27","s":"Совм6","z":"H4","x":"Отзыв устарел\nОтличные лампы, подошли на гранту 1g как влитые, легко настроил даже с учетом что у меня сломанный гидрокомпенсатор, одну лампу очень быстро заменили по гарантии , советую всем","u":false},{"n":740,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"2019","f":"FL","k":0,"w":"ладу гранту","a":"Вячеслав М.","d":"26 сентября 2025","t":"2025-09-26","s":"Совм6","z":"H4","x":"Отзыв устарел\nустановил на ладу гранту фл 19г. светят отлично!","u":false},{"n":741,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"","f":"FL","k":0,"w":"гранты","a":"Георгий С.","d":"24 сентября 2025","t":"2025-09-24","s":"Совм6","z":"H4","x":"Отзыв устарел\nвсем рекомендую заменить лампочки Ильича в фарах гранты фл на эти диодные лампы. Светотеневая граница четкая, светят отлично, встали без доработок, но с трудом из-за дурацкого доступа к фарам на гранте. Видно все отлично, никого не слепят. А с лампами Ильича пусть начальство автотаза ездит, безопаснее с палкой поводыря ночью передвигаться, чем со штатным...  Читать полностью","u":true},{"n":742,"b":"Lada","m":"Granta","c":"Lada Granta","g":"","y":"2024","f":"","k":0,"w":"лада Гранта","a":"Илья С.","d":"18 сентября 2025","t":"2025-09-18","s":"Совм6","z":"H4","x":"Отзыв устарел\nработает все хорошо, единственно греются блоки, но вроде как это нормальная рабочая температура, а так же при включении фар, даже фонит радио)\nлада Гранта 2024 (подгибайте усики и вставляют сразу с резин const ROWS=DATA.rows, CARS=DATA.cars;
const $=id=>document.getElementById(id);
const norm=s=>(s||'').toLowerCase().replace(/ё/g,'е').trim();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const carKeys=new Map(CARS.map(c=>[c.c,norm(c.c+' | '+c.k)]));
const fmt=n=>n.toLocaleString('ru-RU');
const PAGE=40;
let shown=PAGE, exact=null;
function tokens(q){return norm(q).split(/[\s,;]+/).filter(Boolean)}
function matchCar(c,toks){
  const k=carKeys.get(c); if(!k) return false;
  return toks.every(t=>k.includes(t));
}
function stem(t){return t.length>=6?t.slice(0,-1):t}
function search(){
  const q=$('q').value, toks=tokens(q);
  const inText=$('inText').checked;
  let list=ROWS.slice();
  let mode='cars';
  if(exact){ list=list.filter(r=>r.c===exact); }
  else if(toks.length){
    let set=new Set(CARS.filter(c=>matchCar(c.c,toks)).map(c=>c.c));
    if(!set.size){const st=toks.map(stem); set=new Set(CARS.filter(c=>matchCar(c.c,st)).map(c=>c.c));}
    list=list.filter(r=>set.has(r.c)||(inText&&toks.every(t=>norm(r.x).includes(t))));
  }
  list.sort((a,b)=>$('sort').value==='new'?(b.t||'').localeCompare(a.t||''):(a.t||'').localeCompare(b.t||''));
  return {list,toks};
}
function hl(text,terms){
  terms=terms.filter(t=>t.length>=2);
  if(!terms.length) return esc(text);
  const re=new RegExp('('+terms.map(reEsc).join('|')+')','gi');
  let out='',last=0,m;
  while((m=re.exec(text))){ if(m[0]==='') {re.lastIndex++;continue}
    out+=esc(text.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>'; last=m.index+m[0].length;}
  return out+esc(text.slice(last));
}
function card(r,terms){
  const det=[r.g&&('№ '+r.g),r.y&&(r.y+' г.'),r.f].filter(Boolean).join(' · ');
  const t=[r.w,...terms];
  return `<article><div class="head"><span class="name">${esc(r.c)}</span>`+
   (det?`<span class="det">${esc(det)}</span>`:'')+
   
   `<span class="meta">${esc(r.d)} · ${esc(r.a||'без имени')} · ${esc(r.s)}${r.u?' · обрезан':''}</span></div>`+
   `<p class="txt">${hl(r.x,t)}</p></article>`;
}
function overview(){
  const by={}, cm=new Map();
  ROWS.forEach(r=>{const o=cm.get(r.c)||{c:r.c,b:r.b,n:0};o.n++;cm.set(r.c,o)});
  const vis=[...cm.values()];
  vis.forEach(c=>(by[c.b]=by[c.b]||[]).push(c));
  const brands=Object.keys(by).sort((a,b)=>by[b].reduce((s,c)=>s+c.n,0)-by[a].reduce((s,c)=>s+c.n,0));
  const total=vis.reduce((t,c)=>t+c.n,0);
  let h=`<p class="status"><span><b class="mono">${fmt(total)}</b> строк, <b class="mono">${vis.length}</b> автомобилей. Нажмите на автомобиль или начните вводить название.</span></p>`;
  for(const b of brands){
    h+=`<div class="brand">${esc(b)}</div><div class="grid">`+
      by[b].sort((x,y)=>y.n-x.n).map(c=>`<button class="car" data-car="${esc(c.c)}"><span>${esc(c.c.slice(b.length).trim()||c.c)}</span><span class="mono">${c.n}</span></button>`).join('')+`</div>`;
  }
  return h;
}
function render(){
  const {list,toks}=search();
  const out=$('out');
  if(!exact&&!toks.length){ out.innerHTML=overview(); return; }
  const counts=new Map(); list.forEach(r=>counts.set(r.c,(counts.get(r.c)||0)+1));
  const chips=[...counts].sort((a,b)=>b[1]-a[1]).slice(0,30);
  const q=$('q').value.trim();
  let h=`<div class="status"><span><b class="mono">${fmt(list.length)}</b> ${plural(list.length)}${exact?` по автомобилю <b>${esc(exact)}</b>`:(q?` по запросу <b>${esc(q)}</b>`:'')}</span></div>`;
  if(chips.length>1||exact){
    h+=`<div class="chips" role="group" aria-label="Автомобили в выборке">`+
      chips.map(([c,n])=>`<button class="chip" data-car="${esc(c)}" aria-pressed="${exact===c}">${esc(c)}<span class="mono">${n}</span></button>`).join('')+`</div>`;
  }
  if(!list.length){ h+=`<p class="empty">Ничего не найдено. Попробуйте другое написание или отметьте поиск по тексту отзыва.</p>`; out.innerHTML=h; return; }
  const terms=exact?[]:toks;
  h+='<div class="list">'+list.slice(0,shown).map(r=>card(r,terms)).join('')+'</div>';
  if(list.length>shown) h+=`<div class="more"><button class="btn" id="more">Показать ещё (${fmt(list.length-shown)})</button></div>`;
  out.innerHTML=h;
}
function plural(n){const a=n%10,b=n%100;return (a===1&&b!==11)?'отзыв':(a>=2&&a<=4&&(b<10||b>=20))?'отзыва':'отзывов'}
function update(reset=true){ if(reset) shown=PAGE; render(); }
$('q').addEventListener('input',()=>{exact=null;update()});
$('f').addEventListener('submit',e=>e.preventDefault());
$('clear').addEventListener('click',()=>{$('q').value='';exact=null;update();$('q').focus()});
['inText','sort'].forEach(id=>$(id).addEventListener('change',()=>update()));
$('out').addEventListener('click',e=>{
  const car=e.target.closest('[data-car]');
  if(car){const c=car.dataset.car; exact=(exact===c)?null:c; if(exact)$('q').value=c; else if(!$('q').value) {} update(); window.scrollTo({top:0}); return;}
  if(e.target.id==='more'){shown+=PAGE;render();}
});
$('theme').addEventListener('click',()=>{
  const r=document.documentElement, dark=matchMedia('(prefers-color-scheme: dark)').matches;
  const cur=r.dataset.theme||(dark?'dark':'light');
  r.dataset.theme=cur==='dark'?'light':'dark';
});
render();
</script>
