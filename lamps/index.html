<head>
<title>Подбор ламп по авто</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky search bar on top; brand tiles when empty; results grouped by model with one row per generation (years | low | high | fog) */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --fg:#1b1f27; --muted:#667085; --line:#dfe3ea;
  --accent:#b86a00; --accent-bg:#fff1d6; --chip:#eceff4;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161b; --surface:#1c2027; --fg:#e8ebf0; --muted:#98a2b3; --line:#2c323c;
  --accent:#f0a93b; --accent-bg:#3a2c12; --chip:#262c35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1c2027; --fg:#e8ebf0; --muted:#98a2b3; --line:#2c323c;
  --accent:#f0a93b; --accent-bg:#3a2c12; --chip:#262c35; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:960px;margin:0 auto;padding-block:16px 48px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:12px;z-index:5;
  display:grid;grid-template-columns:1fr auto;gap:8px}
h1{grid-column:1/-1;margin:0;font-size:20px;font-weight:600}
h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#q{width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px}
.tile:hover{border-color:var(--accent)} .tile span{color:var(--muted);font-size:13px}
.hint{color:var(--muted);margin:12px 0 0;font-size:13px}
.model{margin-top:20px}
.model h2{font-size:16px;margin:0 0 8px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.model h2 .b{color:var(--muted);font-weight:400;font-size:13px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(120px,1.2fr) repeat(3,minmax(0,1.6fr));gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.gen b{display:block;font-weight:600}
.gen .y{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.gen .k{display:inline-block;margin-top:4px;background:var(--chip);border-radius:6px;padding:1px 6px;font-size:12px;color:var(--muted)}
.cell{min-width:0}
.cell .l{display:none;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lamp{font-family:var(--mono);font-weight:600;font-size:14px;overflow-wrap:anywhere}
.lamp+.lamp{margin-top:4px}
.lamp .c{font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--muted)}
.none{color:var(--muted)}
.note{grid-column:1/-1;background:var(--accent-bg);border-radius:6px;padding:6px 10px;font-size:13px}
.colhead{display:grid;grid-template-columns:minmax(120px,1.2fr) repeat(3,minmax(0,1.6fr));gap:12px;padding:8px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--chip)}
footer{margin-top:32px;color:var(--muted);font-size:12.5px}
footer a{color:var(--accent)}
@media (max-width:640px){
  .colhead{display:none}
  .row{grid-template-columns:1fr 1fr}
  .gen{grid-column:1/-1}
  .cell .l{display:block;margin-bottom:2px}
  .cell:nth-of-type(3){grid-column:1/-1}
}
</style>
</head>

const $=s=>document.querySelector(s), out=$("#out"), q=$("#q"), sel=$("#brand");
const brands=[...new Set(D.map(r=>r[0]))].sort((a,b)=>a.localeCompare(b,"ru"));
const count=b=>D.filter(r=>r[0]===b).length;
brands.forEach(b=>{const o=document.createElement("option");o.value=b;o.textContent=b;sel.append(o)});
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function lamps(v){
  if(!v||/^нет( данных)?$/i.test(v)||/нет галогена/i.test(v)) return `<span class="none">${esc(v||"нет")}</span>`;
  return v.split(/;\s*/).map(p=>{
    const m=p.match(/^(.*?)(?:\s*\((.*)\))?$/);
    let code=m[1],cond=m[2]||"";
    if(/ - /.test(p)&&!cond){const i=p.lastIndexOf(" - ");cond=p.slice(0,i);code=p.slice(i+3)}
    return `<div class="lamp">${esc(code)}${cond?` <span class="c">${esc(cond)}</span>`:""}</div>`}).join("");
}
function render(){
  const t=q.value.trim().toLowerCase(), b=sel.value;
  if(!t&&!b){
    out.innerHTML=`<p class="hint">Выберите марку или начните вводить название.</p><div class="tiles">${brands.map(x=>`<button class="tile" data-b="${esc(x)}">${esc(x)}<span>${count(x)}</span></button>`).join("")}</div>`;
    return;
  }
  const words=t.split(/\s+/).filter(Boolean);
  const res=D.filter(r=>(!b||r[0]===b)&&words.every(w=>(r[0]+" "+r[1]+" "+r[2]+" "+r[3]+" "+r[5]+" "+r[6]+" "+r[7]).toLowerCase().includes(w)));
  if(!res.length){out.innerHTML=`<p class="hint">Ничего не найдено.</p>`;return}
  const g=new Map();
  res.forEach(r=>{const k=r[0]+"|"+r[1];(g.get(k)||g.set(k,[]).get(k)).push(r)});
  let n=0,html="";
  for(const [k,items] of g){
    if(++n>80){html+=`<p class="hint">Показаны первые 80 моделей. Уточните запрос.</p>`;break}
    html+=`<section class="model"><h2>${esc(items[0][1])} <span class="b">${esc(items[0][0])}</span></h2><div class="list"><div class="colhead"><div>Поколение</div><div>Ближний</div><div>Дальний</div><div>ПТФ</div></div>`;
    for(const r of items){
      const note=r[8]&&!/перепроверено|^дальний =|^ПТФ:/.test(r[8])?r[8]:(/комплектации/.test(r[8])?r[8]:"");
      html+=`<div class="row"><div class="gen"><b>${esc(r[2])}</b><span class="y">${esc(r[4])}</span>${r[3]?`<br><span class="k">${esc(r[3])}</span>`:""}</div>
      <div class="cell"><span class="l">Ближний</span>${lamps(r[5])}</div>
      <div class="cell"><span class="l">Дальний</span>${lamps(r[6])}</div>
      <div class="cell"><span class="l">ПТФ</span>${lamps(r[7])}</div>${note?`<div class="note">${esc(note)}</div>`:""}</div>`;
    }
    html+=`</div></section>`;
  }
  out.innerHTML=html;
}
const st=()=>({b:sel.value,q:q.value});
const empty=s=>!s||(!s.b&&!s.q);
function nav(push){try{push?history.pushState(st(),""):history.replaceState(st(),"")}catch(e){}}
q.addEventListener("input",()=>{const was=empty(history.state);render();nav(was&&q.value.trim()!=="")});
sel.addEventListener("change",()=>{render();nav(true)});
out.addEventListener("click",e=>{const t=e.target.closest(".tile");if(t){sel.value=t.dataset.b;render();nav(true);scrollTo(0,0)}});
addEventListener("popstate",e=>{const s=e.state||{b:"",q:""};sel.value=s.b||"";q.value=s.q||"";render();scrollTo(0,0)});
render();nav(false);
</script>
